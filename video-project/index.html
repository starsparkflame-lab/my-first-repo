<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>视频播放</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { position: fixed; inset: 0; }
    video {
      display: block;
      width: 100vw;
      height: 100vh;
      width: 100dvw;
      height: 100dvh;
      margin: 0;
      background: #000;
      object-fit: contain;
    }
    @media (orientation: portrait) {
      video { object-fit: contain; }
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline controls preload="auto">
    <source src="../548db830f36005f439fe144938046798.mp4" type="video/mp4">
  </video>
  <script>
    const video = document.querySelector('#video');
    video.play().catch(() => {
      // Some browsers require a tap before playback begins.
    });
  </script>
</body>
</html>
