<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101115">
  <meta name="description" content="一个为视频打造的独立播放与分享页面。">
  <title>影像计划 · 一段值得收藏的影像</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #f4f1e9;
      background: #101115;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 38%, #a9784420, transparent 36%),
        radial-gradient(ellipse at 90% 8%, #7b6c9021, transparent 35%),
        linear-gradient(155deg, #17171c 0%, #101115 58%, #15130f 100%);
    }
    .shell { width: min(100% - 40px, 1080px); min-height: 100vh; margin: 0 auto; display: grid; grid-template-rows: auto 1fr auto; }
    header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    header { padding: 27px 0; border-bottom: 1px solid #ffffff12; }
    .brand { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; }
    .brand-icon { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid #e4b46b52; border-radius: 12px; background: #e4b46b12; color: #e8bc79; font-size: 17px; }
    .brand-copy { display: grid; gap: 2px; }
    .brand-copy strong { font-size: 13px; font-weight: 650; letter-spacing: .09em; }
    .brand-copy small { color: #85828a; font-size: 9px; letter-spacing: .19em; }
    .edition { color: #9c9690; font-size: 11px; letter-spacing: .12em; }
    main { width: 100%; align-self: center; padding: 70px 0 78px; }
    .intro { max-width: 760px; margin: 0 auto 34px; text-align: center; animation: rise-in .9s cubic-bezier(.2,.8,.2,1) both; }
    .eyebrow { margin: 0 0 18px; color: #d8ab6c; font-size: 10px; letter-spacing: .29em; text-transform: uppercase; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "Noto Serif SC", serif; font-size: clamp(38px, 7vw, 70px); line-height: 1.2; font-weight: 500; letter-spacing: .08em; }
    h1 span { color: #e8bd7d; }
    .subtitle { margin: 16px 0 0; color: #aaa6a2; font-family: "Songti SC", "STSong", "Noto Serif SC", serif; font-size: 15px; letter-spacing: .08em; }
    .film-frame { position: relative; padding: 10px; border: 1px solid #ffffff22; border-radius: 19px; background: linear-gradient(135deg, #ffffff15, #ffffff05 45%, #e4b46b10); box-shadow: 0 28px 90px #0009, 0 0 70px #bd875521; animation: frame-arrive 1.1s .16s cubic-bezier(.2,.8,.2,1) both; }
    .film-frame::before, .film-frame::after { content: ""; position: absolute; z-index: 1; top: 50%; width: 7px; height: 62px; border-radius: 5px; background: repeating-linear-gradient(to bottom, #e8bd7d80 0 5px, transparent 5px 12px); transform: translateY(-50%); pointer-events: none; }
    .film-frame::before { left: -4px; }
    .film-frame::after { right: -4px; }
    video { display: block; width: 100%; max-height: min(67vh, 680px); aspect-ratio: 16 / 9; border-radius: 11px; background: radial-gradient(ellipse, #41362b, #111115 75%); object-fit: contain; }
    .video-info { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 15px 7px 4px; color: #9d9995; font-size: 11px; letter-spacing: .06em; }
    .video-info span:first-child { display: inline-flex; align-items: center; gap: 8px; }
    .video-info span:first-child::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #d9ac6b; box-shadow: 0 0 10px #d9ac6b90; }
    .actions { display: flex; justify-content: center; margin-top: 24px; }
    .download { display: inline-flex; min-height: 43px; align-items: center; gap: 9px; padding: 0 17px; border: 1px solid #e4b46b55; border-radius: 999px; color: #eed5af; background: #e4b46b0c; font-size: 12px; text-decoration: none; transition: background .2s ease, transform .2s ease; }
    .download:hover { transform: translateY(-2px); background: #e4b46b1d; }
    footer { padding: 21px 0 24px; border-top: 1px solid #ffffff12; color: #77747b; font-size: 10px; letter-spacing: .08em; }
    footer span:last-child { color: #9d8f7e; }
    @keyframes rise-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes frame-arrive { from { opacity: 0; transform: translateY(20px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @media (max-width: 620px) {
      .shell { width: min(100% - 28px, 1080px); }
      header { padding: 18px 0; }
      .edition { max-width: 120px; text-align: right; line-height: 1.6; }
      main { padding: 54px 0 58px; }
      .intro { margin-bottom: 25px; }
      .subtitle { font-size: 13px; }
      .film-frame { padding: 6px; border-radius: 13px; }
      video { border-radius: 8px; }
      .video-info { font-size: 10px; }
      footer { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="#top" aria-label="影像计划首页">
        <span class="brand-icon" aria-hidden="true">◉</span>
        <span class="brand-copy"><strong>影像计划</strong><small>VIDEO PROJECT</small></span>
      </a>
      <span class="edition">一段影像 · 一次停留</span>
    </header>
    <main id="top">
      <section class="intro">
        <p class="eyebrow">A MOMENT IN MOTION</p>
        <h1>把这一刻，<span>留下来</span></h1>
        <p class="subtitle">在这里，慢下来，再看一遍。</p>
      </section>
      <section class="film-frame" aria-label="视频播放器">
        <video id="feature-video" controls playsinline preload="metadata">
          <source src="../video.mp4" type="video/mp4">
          你的浏览器暂不支持播放此视频。
        </video>
        <div class="video-info">
          <span>原片播放</span>
          <span id="duration">正在读取视频信息…</span>
        </div>
      </section>
      <div class="actions">
        <a class="download" href="../video.mp4" download>↓ <span>保存视频</span></a>
      </div>
    </main>
    <footer><span>一段影像，一份记忆。</span><span>为分享而作 · VIDEO PROJECT</span></footer>
  </div>
  <script>
    const video = document.querySelector('#feature-video');
    const durationLabel = document.querySelector('#duration');
    video.addEventListener('loadedmetadata', () => {
      if (!Number.isFinite(video.duration)) return;
      const minutes = Math.floor(video.duration / 60);
      const seconds = Math.floor(video.duration % 60).toString().padStart(2, '0');
      durationLabel.textContent = `时长 ${minutes}:${seconds}`;
    });
    video.addEventListener('error', () => {
      durationLabel.textContent = '视频暂时无法加载';
    });
  </script>
</body>
</html>
